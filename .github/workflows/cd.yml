name: Node.js CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    environment: prod
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Clear npx cache
        run: npx clear-npx-cache

      - name: Link to Supabase project
        run: npx supabase@2.1.1 link --project-ref $SUPABASE_PROJECT_ID

      - name: Push database schema
        run: npx supabase@2.1.1 db push --linked --include-all --include-seed

      - name: Generate Supabase types
        run: npx supabase@2.1.1 gen types typescript --linked --schema public > supabase/functions/_common/types/database.ts

      # - name: Deploy Supabase functions
      #   run: npx supabase@2.1.1 functions deploy --project-ref $SUPABASE_PROJECT_ID
